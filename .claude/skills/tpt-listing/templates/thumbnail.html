<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TpT thumbnail</title>
<!-- Square cover, render at 2000 x 2000:  node scripts/render.mjs thumbnail.html 2000 2000 thumbnail.png
     STRUCTURE (keep):  kicker ribbon -> product name -> SUBJECT BANNER -> tagline -> characters +
     "what it is" ticket -> hero object -> sample pages fanned from a corner -> grade/tech pills.
     STYLE (change every product): palette tokens, fonts, background, frame, shapes. See reference/styles.md.
     Replace every {{...}} and image path. Elements with data-check are tested for clipping by render.mjs. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --bg: #f4e6c4; --bg-2: #ead6a4;      /* background and its stripe/ray tone */
    --paper: #fbf3de;                    /* light panels, text on dark */
    --accent: #b3342e;                   /* main color: title, ribbons */
    --ink: #16263a;                      /* outlines, shadows, banner */
    --gold: #e2b95a; --cool: #1d6f86;    /* trim and the tagline */
    --display: 'Rye', serif;             /* product name */
    --slab: 'Alfa Slab One', serif;      /* banners, pills, bubbles */
    --script: 'Lobster', cursive;        /* tagline */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 2000px; height: 2000px; overflow: hidden; position: relative; background: var(--bg); }
  .bg { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 50% 62%, var(--bg) 0 7.5deg, var(--bg-2) 7.5deg 15deg); }
  .bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 62%, var(--paper) 0 12%, transparent 55%); opacity: .9; }
  .frame { position: absolute; inset: 34px; border: 14px solid var(--ink); border-radius: 10px; }
  .frame::after { content: ''; position: absolute; inset: 12px; border: 5px solid var(--accent); border-radius: 4px; }

  .ribbon { position: absolute; left: 50%; top: 118px; transform: translateX(-50%); background: var(--accent); color: var(--paper); white-space: nowrap;
    font-family: var(--slab); font-size: 44px; letter-spacing: 4px; padding: 20px 70px; box-shadow: 0 8px 0 var(--ink);
    clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); }
  .title { position: absolute; left: 0; right: 0; top: 215px; text-align: center; white-space: nowrap; font-family: var(--display); font-size: 292px; line-height: 1;
    color: var(--accent); -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; letter-spacing: 6px;
    text-shadow: 6px 6px 0 var(--ink), 12px 12px 0 var(--ink), 18px 18px 0 var(--ink), 24px 24px 0 var(--ink); }
  /* The SUBJECT (unit/topic buyers search for) gets its own big banner: it is what sells the product in search. */
  .band { position: absolute; left: 70px; right: 70px; top: 530px; height: 150px; background: var(--ink); display: grid; place-items: center;
    clip-path: polygon(0 0, 100% 0, 97.5% 50%, 100% 100%, 0 100%, 2.5% 50%); }
  .band::before { content: ''; position: absolute; inset: 12px 50px; border-top: 4px solid var(--gold); border-bottom: 4px solid var(--gold); }
  .band span { position: relative; font-family: var(--slab); font-size: 94px; letter-spacing: 3px; color: var(--paper); white-space: nowrap; text-shadow: 5px 5px 0 var(--accent); }
  .tag { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font-family: var(--script); font-size: 78px; color: var(--cool); }

  /* Characters: transparent PNG/WebP cut-outs with a white sticker outline. */
  .who { position: absolute; bottom: 290px; }
  .who img { display: block; height: 100%; width: auto;
    filter: drop-shadow(8px 0 0 #fff) drop-shadow(-8px 0 0 #fff) drop-shadow(0 8px 0 #fff) drop-shadow(0 -8px 0 #fff) drop-shadow(14px 16px 0 rgba(0,0,0,.6)); }
  .left { left: 80px; height: 880px; } .right { right: 60px; height: 840px; }
  .bubble { position: absolute; background: #fff; border: 7px solid var(--ink); border-radius: 40px; padding: 22px 34px; font-family: var(--slab); font-size: 50px; color: var(--ink); box-shadow: 10px 10px 0 var(--ink); white-space: nowrap; }
  .bubble::after { content: ''; position: absolute; bottom: -46px; width: 50px; height: 50px; background: #fff; border-right: 7px solid var(--ink); border-bottom: 7px solid var(--ink); transform: rotate(45deg) skew(10deg,10deg); }
  .b1 { left: 330px; top: 800px; transform: rotate(-5deg); } .b1::after { left: 150px; }
  .b2 { right: 300px; top: 820px; transform: rotate(4deg); } .b2::after { right: 160px; }

  /* What the buyer gets, in 2-4 words. */
  .ticket { position: absolute; left: 50%; top: 930px; width: 520px; transform: translateX(-50%) rotate(-3deg); background: var(--gold); border: 8px solid var(--ink);
    border-radius: 18px; padding: 34px 30px; text-align: center; box-shadow: 12px 12px 0 var(--ink); }
  .ticket .t1 { font-family: var(--slab); font-size: 58px; line-height: 1.02; color: var(--accent); }
  .ticket .t2 { font-family: var(--slab); font-size: 40px; color: var(--ink); margin-top: 10px; }
  .ticket hr { border: 0; border-top: 5px dashed var(--ink); margin: 18px 30px; }

  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 430px; background: var(--ink); clip-path: polygon(0 28%, 100% 18%, 100% 100%, 0 100%); }
  .hero { position: absolute; left: 50%; bottom: 245px; width: 1080px; transform: translateX(-50%); }
  .hero img { width: 100%; display: block; }

  /* Real sample pages, fanned up from the bottom-right corner. */
  .sheets { position: absolute; right: 0; bottom: 0; width: 800px; height: 420px; z-index: 5; }
  .sheet { position: absolute; width: 330px; background: #fff; border: 4px solid var(--ink); box-shadow: 10px 10px 0 rgba(0,0,0,.7); }
  .sheet img { display: block; width: 100%; }
  .s1 { left: 20px; top: 150px; transform: rotate(-9deg); } .s2 { left: 420px; top: 140px; transform: rotate(8deg); } .s3 { left: 225px; top: 70px; transform: rotate(-1deg); z-index: 2; }

  .pills { position: absolute; left: 96px; bottom: 92px; display: flex; gap: 22px; z-index: 6; }
  .pill { background: var(--paper); color: var(--ink); border: 6px solid var(--ink); border-radius: 60px; padding: 16px 36px; font-family: var(--slab); font-size: 36px; letter-spacing: 2px; }
  .pill.alt { background: var(--accent); color: var(--paper); }
</style>
</head>
<body>
  <div class="bg"></div><div class="frame"></div>
  <div class="ribbon" data-check="ribbon">{{KICKER, e.g. AN INVESTING GAME ★ 1792–1837}}</div>
  <div class="title" data-check="title">{{PRODUCT NAME}}</div>
  <div class="band" data-check="subject banner"><span>{{SUBJECT, e.g. TRANSPORTATION REVOLUTION}}</span></div>
  <div class="tag" data-check="tagline">{{Tagline: three short verbs or a promise.}}</div>

  <div class="who left"><img src="{{character-1.webp}}" alt=""></div>
  <div class="who right"><img src="{{character-2.webp}}" alt=""></div>
  <div class="bubble b1" data-check="bubble 1">{{Catchphrase!}}</div>
  <div class="bubble b2" data-check="bubble 2">{{Catchphrase!}}</div>

  <div class="ticket" data-check="ticket"><div class="t1">{{INTERACTIVE<br>WEBSITE}}</div><hr><div class="t2">{{+ READING &amp; WORKSHEETS}}</div></div>

  <div class="ground"></div>
  <div class="hero"><img src="{{hero-object.svg}}" alt=""></div>
  <div class="sheets">
    <div class="sheet s1"><img src="{{handouts/page-a.jpg}}" alt=""></div>
    <div class="sheet s2"><img src="{{handouts/page-b.jpg}}" alt=""></div>
    <div class="sheet s3"><img src="{{handouts/page-c.jpg}}" alt=""></div>
  </div>
  <div class="pills"><div class="pill" data-check="pill 1">{{GRADES 8–12}}</div><div class="pill alt" data-check="pill 2">{{CHROMEBOOK READY}}</div></div>
</body>
</html>
